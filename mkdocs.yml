site_name: SynaFlow
site_description: A lightweight, pure-Python pipeline engine that uses type hints to automatically wire and execute Directed Acyclic Graphs with lockstep streaming and optional bounded handoff
site_url: https://humansoftware.github.io/synaflow/
repo_url: https://github.com/humansoftware/synaflow
edit_uri: edit/main/docs/user_docs/
site_author: humansoftware
copyright: MIT License

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/humansoftware/synaflow
  analytics:
    provider: google
    property: G-BNQQQRWCDB

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.sections
    - navigation.expand

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - footnotes
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Introduction: getting-started/introduction.md
  - Tutorial:
      - Level 1 — Hello World: tutorial/hello-world.md
      - Level 2 — Lowercase Transform: tutorial/multiple-steps.md
      - Level 3 — Character Counter: tutorial/observers.md
      - Level 4 — Print Key-Value Pairs: tutorial/materializers.md
      - Level 5 — Streaming: tutorial/streaming.md
  - Core Concepts:
      - How the DAG is Wired: core-concepts/how-dag-is-wired.md
      - Build vs Run: core-concepts/build-vs-run.md
      - Lockstep Data Flow: core-concepts/lockstep-flow.md
      - Max In Flight: core-concepts/max-in-flight.md
      - Event-Based Processing: core-concepts/event-based.md
      - Materialization & Errors: core-concepts/materialization.md
      - Semantic Naming: core-concepts/semantic-naming.md
      - DAG Construction: core-concepts/dag-construction.md
      - Sync & Async Parity: core-concepts/sync-async.md
      - Pipeline Registry & CLI: core-concepts/pipeline-registry-and-cli.md
      - Examples: core-concepts/examples.md
  - Advanced:
      - Asymmetric Lockstep Deadlocks: advanced/asymmetric-lockstep-deadlocks.md
      - Testability & Overrides: advanced/testability.md
      - Resources & Factories: advanced/resources.md
      - Custom Materializers: advanced/custom-materializers.md
      - Custom Observers: advanced/custom-observers.md
      - Export Guidance: advanced/export-guidance.md
  - Comparisons:
      - Hamilton: comparisons/hamilton.md
      - Java Streams: comparisons/java-streams.md
      - LINQ: comparisons/linq.md

docs_dir: docs/user_docs
