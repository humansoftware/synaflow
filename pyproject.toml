[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synaflow"
version = "0.24.0"
description = "A lightweight, type-hint driven engine for executing Directed Acyclic Graphs (DAGs) and lockstep pipelines in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "mvallebr", email = "mvallebr@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["inflect>=7.0"]

[project.urls]
Homepage = "https://github.com/humansoftware/synaflow"
Repository = "https://github.com/humansoftware/synaflow.git"




































[tool.coverage.run]
omit = ["tests/*", "scripts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = ["."]
timeout = 10
timeout_method = "thread"

[tool.hatch.build.targets.wheel]
packages = ["synaflow"]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]
commit_parser = "angular"
major_on_zero = false


































[dependency-groups]
dev = [
    "mkdocs-material>=9.5",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.17",
]
